name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Install Packages
        run: |
          sudo apt update && sudo apt install -y build-essential bc gcc-aarch64-linux-gnu zip python3
      - name: Build Kernel
        run: |
          chmod +x build_kernel.py
          python3 build_kernel.py --oneui --target=m31
      - name: Upload Final Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-M31-Final
          path: "**/*.zip"
