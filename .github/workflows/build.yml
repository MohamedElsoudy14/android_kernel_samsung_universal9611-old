name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Compiler
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu clang zip python3
          # عمل وصلة عشان السكربت يشوف الكومبيلر في المكان اللي هو عايزه
          sudo mkdir -p ./toolchain/bin
          sudo ln -s /usr/bin/clang ./toolchain/bin/clang

      - name: Build Kernel
        run: |
          chmod +x build_kernel.py
          # تشغيل البناء مباشرة
          python3 build_kernel.py --oneui --target=m31

      - name: Upload Final Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-M31-Final
          path: "**/*.zip"
